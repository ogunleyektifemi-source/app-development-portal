<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            padding: 10px;
            background: #e8f5e9;
            margin-bottom: 20px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Password Assistance</h1>

    <p>
        If you have forgotten your password,
        please contact us using the email address
        you registered with.
    </p>

    <p>
        <strong>Email:</strong><br>
        <a href="mailto:ogunleyektifemi@gmail.com">
            ogunleyektifemi@gmail.com
        </a>
    </p>

    <p>
        Once your identity has been verified,
        a temporary password will be issued so
        you can log in and create a new password.
    </p>

    <a href="{{ url_for('login') }}">
        ← Return to Login
    </a>

</div>

</body>
</html>
