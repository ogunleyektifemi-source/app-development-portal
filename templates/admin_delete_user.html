<!DOCTYPE html>
<html>

<head>

    <title>Delete User</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Delete User Account</h1>

    <p style="color:red;">
        Warning: This permanently deletes the user,
        all projects, messages, uploads and notifications.
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>User Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <button
            type="submit"
            onclick="return confirm('Delete this user permanently?');"
        >
            Delete User
        </button>

    </form>

</div>

</body>

</html>
