<!DOCTYPE html>
<html>

<head>

    <title>Reset User Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>Reset User Password</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Temporary Password</label>

        <input
            type="text"
            name="password"
            required
        >

        <button type="submit">

            Reset Password

        </button>

    </form>

</div>

</body>

</html>
