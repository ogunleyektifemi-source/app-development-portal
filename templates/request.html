<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request an Application</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">
        OSL AppDev
    </div>


    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/#services">
            Services
        </a>

        <a href="/#about">
            About
        </a>

    </div>

</nav>



<section class="request-section zoom">


    <div class="request-container">


        <p class="small-heading">
            START YOUR PROJECT
        </p>


        <h1>
            Tell Me About Your Application
        </h1>


        <p class="request-intro">

            Tell me about the application you would
            like to create. I'll review your request
            and get back to you.

        </p>



        <form
            method="POST"
            class="request-form"
        >


            <label>
                Your Name
            </label>


            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >



            <label>
                Email Address
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >



            <label>
                Type of Application
            </label>


            <select
                name="project_type"
                required
            >

                <option value="">
                    Select an option
                </option>

                <option value="Web Application">
                    Web Application
                </option>

                <option value="Mobile Application">
                    Mobile Application
                </option>

                <option value="Desktop Application">
                    Desktop Application
                </option>

                <option value="Custom Software">
                    Custom Software
                </option>

                <option value="Other">
                    Other
                </option>

            </select>



            <label>
                Describe Your Project
            </label>


            <textarea
                name="project_description"
                placeholder="Tell me what you would like your application to do..."
                rows="7"
                required
            ></textarea>



            <label>
                Refrence Price/How much you are willing to offer (Optional)
            </label>


            <input
                type="text"
                name="budget"
                placeholder="Example: $500 - $1,000"
            >



            <button
                type="submit"
                class="primary-button"
            >

                Submit Project Request

            </button>


        </form>


    </div>


</section>

<script src="{{ url_for('static', filename='animations.js') }}"></script>
</body>

</html>
